[project]
name = "attention-cost-simulator"
version = "0.1.0"
description = "Simulate and chart how attention cost grows as N² with context length."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# This line turns `attention-sim` into a real command after `pip install -e .`
# It points to the `app` object in cli.py. That is why we can type
# `attention-sim 1000 10000` instead of `python -m ...`.
[project.scripts]
attention-sim = "attention_sim.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]